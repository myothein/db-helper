name: Dependency bootstrap and build diagnostics
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  lockfile-bootstrap:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/release-security-baseline-20261122' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out only the proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lock without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to draft branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: lock dependency graph for reproducible CI'
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
  build-smoke:
    needs: lockfile-bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean dependency installation without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile
        run: npm run build
      - name: Non-destructive backup and tenant identifier safety tests
        run: npm test


  postgres17-backup-restore:
    needs: lockfile-bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      RUN_PG_BACKUP_E2E: '1'
      RUN_PG_TENANT_ISOLATION: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_qa
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: tenant_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_qa -d tenant_backup_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout review-only security draft
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and compile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: PostgreSQL 17 disposable backup and independent restore parity test
        run: npm test
      - name: Verify additive student idempotency migration and uniqueness in disposable PostgreSQL 17
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          const fs = require('node:fs');
          (async () => {
            const db = new Client({
              host:'127.0.0.1',port:5432,user:'ci_qa',
              password:'ci_only_password',database:'tenant_backup_ci'
            });
            await db.connect();
            try {
              const sql = fs.readFileSync(
                'prisma/tenant/migrations/20261123151000_student_write_idempotency/migration.sql',
                'utf8'
              );
              await db.query(sql);
              const digest = 'a'.repeat(64);
              const fingerprint = 'b'.repeat(64);
              const params = ['synthetic_tenant',digest,'synthetic_actor','student.create',
                'collection',fingerprint];
              const insert =
                'INSERT INTO student_write_idempotency ' +
                '(tenant_code,key_digest,principal_id,operation,resource_id,request_digest) ' +
                'VALUES ($1,$2,$3,$4,$5,$6)';
              await db.query(insert,params);
              let duplicate = false;
              try { await db.query(insert,params); }
              catch (e) { if (e.code === '23505') duplicate = true; else throw e; }
              if (!duplicate) throw Error('Missing unique tenant/key replay serialization');
              await db.query(
                'UPDATE student_write_idempotency SET response_status=201,response_body=$1::jsonb ' +
                'WHERE tenant_code=$2 AND key_digest=$3',
                [JSON.stringify({id:'synthetic',classId:1,gradeId:1}),params[0],params[1]]
              );
              const row = await db.query(
                'SELECT response_status,response_body FROM student_write_idempotency ' +
                'WHERE tenant_code=$1 AND key_digest=$2',
                [params[0],params[1]]
              );
              if(row.rows[0].response_status!==201 ||
                Object.keys(row.rows[0].response_body).sort().join(',')!=='classId,gradeId,id') {
                throw Error('Invalid replay response storage');
              }
              let rejected = false;
              try { await db.query(
                'UPDATE student_write_idempotency SET response_status=500 ' +
                'WHERE tenant_code=$1 AND key_digest=$2',[params[0],params[1]]
              ); }
              catch(e){ if(e.code==='23514')rejected=true;else throw e; }
              if(!rejected)throw Error('Response status constraint did not fail closed');
              await db.query('DELETE FROM student_write_idempotency');
              console.log('PASS: migration, uniqueness, replay response and constraints');
            } finally { await db.end(); }
          })().catch(e=>{ console.error('Disposable migration QA failed: '+e.name); process.exitCode=1; });
          NODE
